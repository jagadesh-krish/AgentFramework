<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resto Chef Chat</title>
  <link rel="icon" href="/static/chatbot-logo.png" />
  <style>
    :root { 
      --bg:#0f172a; 
      --panel:#111827; 
      --accent:#22d3ee; 
      --text:#e5e7eb; 
      --muted:#94a3b8;
      --success:#10b981;
      --user-msg:#1e40af;
      --assistant-msg:#0c4a6e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      margin:0; 
      background:linear-gradient(180deg,#0b1220,#0f172a 30%,#0b1220); 
      color:var(--text); 
      font:14px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,'Noto Sans',sans-serif; 
      height:100vh; 
      display:flex; 
    }
    .container { 
      margin:auto; 
      width:min(900px,100%); 
      height:min(85vh,800px); 
      display:grid; 
      grid-template-rows:auto 1fr auto; 
      gap:16px; 
      padding:20px; 
    }
    header { 
      display:flex; 
      align-items:center; 
      gap:12px; 
      padding:12px;
      background:rgba(17,24,39,.8);
      border-radius:12px;
      border:1px solid rgba(255,255,255,.08);
    }
    header img { width:32px; height:32px; border-radius:50%; }
    header h1 { margin:0; font-size:20px; font-weight:600; background:linear-gradient(90deg,#22d3ee,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .chat { 
      background:rgba(17,24,39,.6); 
      border:1px solid rgba(255,255,255,.08); 
      backdrop-filter: blur(8px); 
      border-radius:16px; 
      padding:20px; 
      overflow:auto; 
      scroll-behavior:smooth;
    }
    .chat::-webkit-scrollbar { width:8px; }
    .chat::-webkit-scrollbar-track { background:rgba(255,255,255,.05); border-radius:4px; }
    .chat::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:4px; }
    .chat::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.3); }
    .empty { 
      color:var(--muted); 
      text-align:center; 
      margin-top:40px; 
      font-size:16px;
      opacity:0.7;
    }
    .msg { 
      display:flex; 
      gap:12px; 
      margin:16px 0; 
      animation:slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from { opacity:0; transform:translateY(10px); }
      to { opacity:1; transform:translateY(0); }
    }
    .msg .role { 
      flex:0 0 auto; 
      width:36px; 
      height:36px; 
      border-radius:50%; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      font-weight:700; 
      font-size:14px; 
      background:#334155; 
      color:#e2e8f0;
      box-shadow:0 2px 8px rgba(0,0,0,0.2);
    }
    .msg.assistant .role { 
      background:linear-gradient(135deg,#0ea5e9,#06b6d4); 
      color:#fff;
    }
    .msg.user .role {
      background:linear-gradient(135deg,#3b82f6,#2563eb);
      color:#fff;
    }
    .bubble { 
      background:#0b1220; 
      border:1px solid rgba(255,255,255,.1); 
      padding:14px 16px; 
      border-radius:14px; 
      max-width:75%; 
      white-space:pre-wrap; 
      word-wrap:break-word;
      box-shadow:0 2px 8px rgba(0,0,0,0.15);
      line-height:1.6;
    }
    .msg.user .bubble { 
      background:linear-gradient(135deg,#1e3a8a,#1e40af);
      color:#e0e7ff;
      border:1px solid rgba(59,130,246,0.3);
    }
    .msg.assistant .bubble {
      background:linear-gradient(135deg,#0c4a6e,#075985);
      color:#e0f2fe;
      border:1px solid rgba(14,165,233,0.3);
    }
    .msg.thinking .bubble {
      background:rgba(17,24,39,.8);
      border:1px solid rgba(34,211,238,0.3);
    }
    form { display:flex; gap:12px; flex-direction:column; }
    textarea { 
      flex:1; 
      background:rgba(11,18,32,0.8); 
      border:1px solid rgba(255,255,255,.12); 
      color:var(--text); 
      border-radius:12px; 
      padding:14px 16px; 
      min-height:52px; 
      max-height:140px; 
      resize:vertical; 
      outline:none;
      font-family:inherit;
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(34,211,238,0.1);
    }
    button { 
      background:linear-gradient(90deg,#06b6d4,#22d3ee); 
      color:#0b1220; 
      border:none; 
      border-radius:12px; 
      padding:14px 24px; 
      font-weight:700; 
      cursor:pointer; 
      display:flex; 
      align-items:center; 
      justify-content:center;
      gap:8px;
      transition:transform 0.2s, box-shadow 0.2s;
      box-shadow:0 4px 12px rgba(6,182,212,0.3);
    }
    button:hover:not([disabled]) {
      transform:translateY(-2px);
      box-shadow:0 6px 16px rgba(6,182,212,0.4);
    }
    button:active:not([disabled]) {
      transform:translateY(0);
    }
    button[disabled] { 
      opacity:.5; 
      cursor:not-allowed;
      transform:none;
    }
    .row { display:flex; align-items:center; gap:12px; }
    .status { 
      color:var(--muted); 
      font-size:12px; 
      padding:0 4px;
      display:flex;
      align-items:center;
      gap:6px;
    }
    .status-indicator {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--muted);
      animation:pulse 2s infinite;
    }
    .status-indicator.connected {
      background:var(--success);
      animation:none;
    }
    @keyframes pulse {
      0%, 100% { opacity:1; }
      50% { opacity:0.5; }
    }
    .thinking {
      display:flex;
      gap:8px;
      align-items:center;
      padding:4px 0;
    }
    .thinking-dot {
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--accent);
      animation:thinking 1.4s infinite;
      flex-shrink:0;
    }
    .thinking-dot:nth-child(1) {
      animation-delay:0s;
    }
    .thinking-dot:nth-child(2) {
      animation-delay:0.2s;
    }
    .thinking-dot:nth-child(3) {
      animation-delay:0.4s;
    }
    @keyframes thinking {
      0%, 60%, 100% { 
        transform:translateY(0); 
        opacity:0.5; 
      }
      30% { 
        transform:translateY(-8px); 
        opacity:1; 
      }
    }
    .thinking-text {
      color:var(--accent);
      font-style:italic;
      font-size:14px;
      font-weight:500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="/static/chatbot-logo.png" alt="Chatbot" />
      <h1>Resto Chef Chat</h1>
    </header>

    <div id="chat" class="chat" aria-live="polite" aria-busy="false">
      <div id="empty" class="empty">Say hello to get started.</div>
    </div>

    <form id="composer" autocomplete="off">
      <div class="row" style="width:100%">
        <textarea id="input" placeholder="Type a message and press Enter…" required></textarea>
        <button id="send" type="submit">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12L4.29289 11.2929C3.90237 11.6834 3.90237 12.3166 4.29289 12.7071L5 12ZM20 12L20.7071 12.7071C21.0976 12.3166 21.0976 11.6834 20.7071 11.2929L20 12ZM10.2929 6.29289L4.29289 12.2929L5.70711 13.7071L11.7071 7.70711L10.2929 6.29289ZM4.29289 11.7071L10.2929 17.7071L11.7071 16.2929L5.70711 10.2929L4.29289 11.7071ZM5 13H20V11H5V13Z" fill="#0b1220"/></svg>
          Send
        </button>
      </div>
      <div class="status" id="status"><span class="status-indicator"></span> Disconnected</div>
    </form>
  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
